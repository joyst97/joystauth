<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOYST AUTH | Create Developer Workspace</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #090204;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            overflow-x: hidden;
        }
        .auth-card {
            background: rgba(16, 4, 8, 0.92);
            border: 1px solid rgba(244, 63, 94, 0.35);
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            padding: 36px 30px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(225, 29, 72, 0.15);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            position: relative;
            z-index: 10;
        }
        .auth-brand {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-brand h2 {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            letter-spacing: -0.5px;
            margin: 0;
        }
        .auth-brand p {
            font-size: 13px;
            color: var(--text-muted, #9aa0a6);
            margin-top: 5px;
        }
        #bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }
        #toast-container {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            width: auto;
            max-width: 90vw;
        }
        .toast {
            background: rgba(12, 3, 7, 0.88);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border-radius: 9999px;
            padding: 11px 26px;
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: 0.2px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.18);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            animation: dynamicIslandDrop 0.38s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
            white-space: nowrap;
        }
        .toast-success {
            border: 1px solid rgba(16, 185, 129, 0.6);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(16, 185, 129, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .toast-error {
            border: 1px solid rgba(239, 68, 68, 0.6);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(239, 68, 68, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .toast-info {
            border: 1px solid rgba(244, 63, 94, 0.6);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(244, 63, 94, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        @keyframes dynamicIslandDrop {
            0% { opacity: 0; transform: translateY(-35px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>
    <canvas id="bg-particles"></canvas>

    <div class="auth-card">
        <div class="auth-brand">
            <img src="/static/img/joyst_logo.png" alt="JOYST" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 25px rgba(225, 29, 72, 0.6); border: 2px solid rgba(244, 63, 94, 0.5); margin-bottom: 12px;">
            <h2>JOYST AUTH</h2>
            <p>Create your Developer Workspace</p>
        </div>

        <!-- Sleek Social OAuth Buttons (Google & Discord) -->
        <div class="oauth-social-row" style="display: flex; gap: 12px; margin-bottom: 20px;">
            <button type="button" onclick="handleGoogleSignUpClick()" class="oauth-pill-btn google-pill" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 9px; padding: 11px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.25s ease;">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Google</span>
            </button>

            <button type="button" onclick="handleDiscordSignInClick()" class="oauth-pill-btn discord-pill" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 9px; padding: 11px; background: rgba(88, 101, 242, 0.1); border: 1px solid rgba(88, 101, 242, 0.35); border-radius: 12px; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.25s ease;">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="#5865F2">
                    <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                </svg>
                <span>Discord</span>
            </button>
        </div>

        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 22px;">
            <div style="flex: 1; height: 1px; background: rgba(255, 255, 255, 0.1);"></div>
            <span style="font-size: 11px; font-weight: 800; color: var(--text-muted, #9aa0a6); text-transform: uppercase; letter-spacing: 0.5px;">Or register with username</span>
            <div style="flex: 1; height: 1px; background: rgba(255, 255, 255, 0.1);"></div>
        </div>

        <form id="register-form">
            <div class="form-group" style="margin-bottom: 16px;">
                <label>Developer Username</label>
                <input type="text" id="reg-username" class="form-control" placeholder="Choose username" required autofocus minlength="3">
            </div>

            <div class="form-group" style="margin-bottom: 16px;">
                <label>Official Email Address <span style="color: #ff4d79; font-weight: 800;">*</span></label>
                <input type="email" id="reg-email" class="form-control" placeholder="developer@gmail.com" required>
            </div>

            <div class="form-group" style="margin-bottom: 16px;">
                <label>Password <span style="color: #ff4d79; font-weight: 800;">*</span></label>
                <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="6">
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label>Confirm Password <span style="color: #ff4d79; font-weight: 800;">*</span></label>
                <input type="password" id="reg-confirm-password" class="form-control" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 13px; font-size: 14px;">
                Create Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted, #9aa0a6);">
            Already have an account? <a href="/login" style="color: #ff4d79; text-decoration: none; font-weight: 700;">Sign in here</a>
        </div>
        <div style="text-align: center; margin-top: 12px; font-size: 12px;">
            <a href="/" style="color: var(--text-dim, #64748b); text-decoration: none;">&larr; Back to Homepage</a>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="/static/js/particles.js"></script>
    <script>
        const GOOGLE_CLIENT_ID = "1029635040070-o00five90cn8ur7fhu4u5jnp8cbcdrla.apps.googleusercontent.com";

        function showToast(message, type = "success") {
            const container = document.getElementById("toast-container");
            container.innerHTML = "";
            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;
            const icon = type === 'success' ? '✅' : (type === 'error' ? '🚫' : '⚡');
            toast.innerHTML = `<span style="font-size: 16px;">${icon}</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = "0";
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        let tokenClient;

        function initGoogleServices() {
            if (window.google && window.google.accounts && window.google.accounts.oauth2) {
                try {
                    tokenClient = google.accounts.oauth2.initTokenClient({
                        client_id: GOOGLE_CLIENT_ID,
                        scope: "openid email profile",
                        prompt: "select_account",
                        callback: async (tokenResponse) => {
                            if (tokenResponse && tokenResponse.access_token) {
                                try {
                                    const userInfoRes = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
                                        headers: { Authorization: `Bearer ${tokenResponse.access_token}` }
                                    });
                                    const userInfo = await userInfoRes.json();
                                    const res = await fetch("/api/v1/auth/google", {
                                        method: "POST",
                                        headers: { "Content-Type": "application/json" },
                                        body: JSON.stringify({ email: userInfo.email, name: userInfo.name, google_id: userInfo.sub })
                                    });
                                    const data = await res.json();
                                    if (res.ok && data.access_token) {
                                        localStorage.setItem("auth_admin_token", data.access_token);
                                        localStorage.setItem("dev_owner_id", data.owner_id);
                                        localStorage.setItem("dev_username", data.username);
                                        showToast("Account Ready! Welcome to Joyst Auth", "success");
                                        setTimeout(() => {
                                            window.location.href = data.redirect_url || "/dashboard";
                                        }, 400);
                                    } else {
                                        showToast(data.detail || "Google authentication failed", "error");
                                    }
                                } catch (err) {
                                    showToast("Connection failed: " + err.message, "error");
                                }
                            }
                        }
                    });
                } catch (e) {
                    console.warn("Google OAuth2 Init:", e);
                }
            }
        }

        window.addEventListener("load", () => {
            setTimeout(initGoogleServices, 200);
        });

        function handleGoogleSignUpClick() {
            if (tokenClient) {
                tokenClient.requestAccessToken({ prompt: "select_account" });
            } else if (window.google && window.google.accounts && window.google.accounts.id) {
                google.accounts.id.prompt();
            }
        }

        const DISCORD_CLIENT_ID = "1540058805138882730";
        const DISCORD_REDIRECT_URI = "https://joystauth.cc/api/v1/auth/discord/callback";

        function handleDiscordSignInClick() {
            localStorage.clear();
            const discordUrl = `https://discord.com/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(DISCORD_REDIRECT_URI)}&scope=identify+email+guilds.join+applications.commands&integration_type=1&prompt=consent`;
            window.location.href = discordUrl;
        }

        document.getElementById("register-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("reg-username").value.trim();
            const email = document.getElementById("reg-email").value.trim();
            const password = document.getElementById("reg-password").value;
            const confirmPassword = document.getElementById("reg-confirm-password").value;
            const btn = document.getElementById("btn-submit");

            if (!email || !email.includes("@") || !email.includes(".")) {
                showToast("Please enter a valid, real Email Address!", "error");
                return;
            }

            if (password !== confirmPassword) {
                showToast("Passwords do not match!", "error");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Creating Account...";

            try {
                const res = await fetch("/api/v1/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();
                if (res.ok && data.access_token) {
                    localStorage.setItem("auth_admin_token", data.access_token);
                    localStorage.setItem("dev_owner_id", data.owner_id);
                    localStorage.setItem("dev_username", data.username);
                    showToast("Account Created Successfully! Opening Dashboard...", "success");
                    setTimeout(() => {
                        window.location.href = data.redirect_url || "/dashboard";
                    }, 400);
                } else {
                    showToast(data.detail || "Registration failed", "error");
                    btn.disabled = false;
                    btn.textContent = "Create Account";
                }
            } catch (err) {
                showToast("Server Connection Failed", "error");
                btn.disabled = false;
                btn.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>

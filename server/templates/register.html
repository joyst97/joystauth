<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joyst Corporation | Create Developer Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <!-- Official Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #07090e;
            padding: 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-highlight);
            border-radius: var(--radius-lg);
            padding: 38px;
            box-shadow: var(--shadow-md), 0 0 40px rgba(99, 102, 241, 0.1);
            position: relative;
            z-index: 10;
        }
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-accent);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }
        .auth-brand {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-brand h2 {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .auth-brand p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        #bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }
        #google-signup-btn-container iframe {
            margin: 0 auto !important;
            border-radius: 10px !important;
        }
    </style>
</head>
<body>
    <canvas id="bg-particles"></canvas>

    <div class="auth-card">
        <div class="auth-brand">
            <img src="/static/img/joyst_logo.png" alt="JOYST" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 25px rgba(225, 29, 72, 0.6); border: 2px solid rgba(244, 63, 94, 0.5); margin-bottom: 12px;">
            <h2>JOYST AUTH</h2>
            <p>Create your Developer Workspace</p>
        </div>

        <!-- Official Google Sign Up Container -->
        <div id="google-signup-btn-container" style="margin-bottom: 20px; display: flex; justify-content: center; width: 100%;">
            <button type="button" id="fallback-google-btn" onclick="handleGoogleSignInClick()" class="btn btn-secondary" style="width: 100%; justify-content: center; padding: 12px; font-size: 13.5px; font-weight: 700; gap: 10px; border-radius: 10px; cursor: pointer;">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Continue with Google</span>
            </button>
        </div>

        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 22px;">
            <div style="flex: 1; height: 1px; background: rgba(255, 255, 255, 0.1);"></div>
            <span style="font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Or register with details</span>
            <div style="flex: 1; height: 1px; background: rgba(255, 255, 255, 0.1);"></div>
        </div>

        <form id="register-form">
            <div class="form-group">
                <label>Developer Username</label>
                <input type="text" id="reg-username" class="form-control" placeholder="e.g. AlexDev" required autofocus minlength="3">
            </div>

            <div class="form-group">
                <label>Email Address (Optional)</label>
                <input type="email" id="reg-email" class="form-control" placeholder="developer@example.com">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="6">
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label>Plan Upgrade Key <span style="font-size: 11px; color: var(--text-muted); font-weight: 500;">(Optional - For Developer / Enterprise)</span></label>
                <input type="text" id="reg-plan-key" class="form-control mono" placeholder="Leave blank for Free Plan, or enter Upgrade Key">
            </div>

            <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 13px; font-size: 14px;">
                Create Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted);">
            Already have an account? <a href="/login" style="color: #ff4d79; text-decoration: none; font-weight: 700;">Sign in here</a>
        </div>
        <div style="text-align: center; margin-top: 12px; font-size: 12px;">
            <a href="/" style="color: var(--text-dim); text-decoration: none;">&larr; Back to Homepage</a>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="/static/js/particles.js"></script>
    <script>
        const GOOGLE_CLIENT_ID = "1029635040070-o00five90cn8ur7fhu4u5jnp8cbcdrla.apps.googleusercontent.com";

        function showToast(message, type = "info") {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = "0";
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        let tokenClient;

        function initGoogleServices() {
            if (window.google && window.google.accounts && window.google.accounts.oauth2) {
                try {
                    tokenClient = google.accounts.oauth2.initTokenClient({
                        client_id: GOOGLE_CLIENT_ID,
                        scope: "openid email profile",
                        prompt: "select_account",
                        callback: async (tokenResponse) => {
                            if (tokenResponse && tokenResponse.access_token) {
                                showToast("Authenticating with Google...", "info");
                                try {
                                    const userInfoRes = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
                                        headers: { Authorization: `Bearer ${tokenResponse.access_token}` }
                                    });
                                    const userInfo = await userInfoRes.json();
                                    const res = await fetch("/api/v1/auth/google", {
                                        method: "POST",
                                        headers: { "Content-Type": "application/json" },
                                        body: JSON.stringify({ email: userInfo.email, name: userInfo.name, google_id: userInfo.sub })
                                    });
                                    const data = await res.json();
                                    if (res.ok && data.access_token) {
                                        localStorage.setItem("auth_admin_token", data.access_token);
                                        localStorage.setItem("dev_owner_id", data.owner_id);
                                        localStorage.setItem("dev_username", data.username);
                                        showToast("Google Account Authenticated! Opening Dashboard...", "success");
                                        setTimeout(() => {
                                            window.location.href = data.redirect_url || "/dashboard";
                                        }, 500);
                                    } else {
                                        showToast(data.detail || "Google authentication failed", "error");
                                    }
                                } catch (err) {
                                    showToast("Connection failed: " + err.message, "error");
                                }
                            }
                        }
                    });
                } catch (e) {
                    console.warn("Google OAuth2 Init:", e);
                }
            }
        }

        window.addEventListener("load", () => {
            setTimeout(initGoogleServices, 200);
        });

        function handleGoogleSignUpClick() {
            if (tokenClient) {
                tokenClient.requestAccessToken({ prompt: "select_account" });
            } else if (window.google && window.google.accounts && window.google.accounts.id) {
                google.accounts.id.prompt();
            }
        }
                    google.accounts.id.prompt();
                }
            } catch (e) {
                console.warn("Google GSI Init:", e);
            }
        }

        window.addEventListener("load", () => {
            setTimeout(initGoogleServices, 300);
        });

        function handleGoogleSignInClick() {
            const storedId = localStorage.getItem("custom_google_client_id") || activeGoogleClientId;
            if (!storedId) {
                document.getElementById("google-setup-modal").style.display = "flex";
            } else {
                if (window.google && window.google.accounts && window.google.accounts.id) {
                    google.accounts.id.prompt();
        }

        async function handleGoogleCredentialResponse(response) {
            if (response && response.credential) {
                showToast("Authenticating with Google Identity...", "info");
                try {
                    const res = await fetch("/api/v1/auth/google", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ credential: response.credential })
                    });
                    const data = await res.json();
                    if (res.ok && data.access_token) {
                        localStorage.setItem("auth_admin_token", data.access_token);
                        localStorage.setItem("dev_owner_id", data.owner_id);
                        localStorage.setItem("dev_username", data.username);
                        showToast("Google Account Authenticated! Opening Dashboard...", "success");
                        setTimeout(() => {
                            window.location.href = data.redirect_url || "/dashboard";
                        }, 500);
                    } else {
                        showToast(data.detail || "Google authentication failed", "error");
                    }
                } catch (err) {
                    showToast("Connection failed: " + err.message, "error");
                }
            }
        }

        // Auto-fill from query params if present
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("key")) {
            document.getElementById("reg-plan-key").value = urlParams.get("key");
        }

        document.getElementById("register-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("reg-username").value.trim();
            const email = document.getElementById("reg-email").value.trim();
            const password = document.getElementById("reg-password").value;
            const plan_key = document.getElementById("reg-plan-key").value.trim();
            const btn = document.getElementById("btn-submit");

            btn.disabled = true;
            btn.textContent = "Creating Account...";

            try {
                const res = await fetch("/api/v1/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, email, password, plan_key })
                });
                const data = await res.json();
                if (res.ok && data.access_token) {
                    localStorage.setItem("auth_admin_token", data.access_token);
                    localStorage.setItem("dev_owner_id", data.owner_id);
                    localStorage.setItem("dev_username", data.username);
                    showToast("Account created successfully! Welcome...", "success");
                    setTimeout(() => {
                        window.location.href = "/dashboard";
                    }, 500);
                } else {
                    showToast(data.detail || "Failed to create account", "error");
                    btn.disabled = false;
                    btn.textContent = "Create Account";
                }
            } catch (err) {
                showToast("Connection failed: " + err.message, "error");
                btn.disabled = false;
                btn.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOYST CORP AUTH | Reseller Portal Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css?v=2.7.0">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #060204;
            padding: 20px;
            position: relative;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            backdrop-filter: blur(28px);
            border: 1px solid rgba(225, 29, 72, 0.35);
            border-radius: 18px;
            padding: 38px 32px;
            box-shadow: 0 15px 40px -10px rgba(225, 29, 72, 0.3);
            position: relative;
            z-index: 10;
        }
        .auth-brand {
            text-align: center;
            margin-bottom: 26px;
        }
        .auth-brand h2 {
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            margin-top: 10px;
        }
        .auth-brand p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
    </style>
</head>
<body>







<!-- Joyst Auth & Cloudflare Edge Verification Gatekeeper -->
<div id="cf-enclave-gatekeeper" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#060205;z-index:99999999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui, -apple-system, sans-serif;transition:opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);">
    <div style="text-align:center;padding:40px 30px;width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;">
        <img src="/static/img/joyst_logo.png" alt="JOYST AUTH" style="width:76px;height:76px;object-fit:contain;border-radius:18px;margin-bottom:22px;filter:drop-shadow(0 0 25px rgba(255,42,95,0.45));">
        <h1 style="color:#ffffff;font-size:26px;font-weight:900;letter-spacing:-0.4px;margin:0 0 10px 0;text-shadow:0 2px 10px rgba(0,0,0,0.5);">JOYST AUTH</h1>
        <p style="color:#94a3b8;font-size:15px;font-weight:500;margin:0 0 28px 0;">Please wait while we validate your connection.</p>
        
        <!-- High-Tech Cloudflare Security Verification Box -->
        <div id="cf-verification-card" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.13);border-radius:14px;padding:14px 22px;box-shadow:0 12px 35px rgba(0,0,0,0.8),inset 0 1px 0 rgba(255,255,255,0.15);display:inline-flex;justify-content:space-between;align-items:center;width:100%;max-width:350px;min-height:70px;margin-bottom:15px;transition:all 0.35s ease;">
            <div style="display:flex;align-items:center;gap:14px;">
                <div id="cf-status-icon" style="width:24px;height:24px;border:2.5px solid rgba(255,255,255,0.18);border-top:2.5px solid #10b981;border-radius:50%;animation:cfSpin 0.9s linear infinite;flex-shrink:0;"></div>
                <div style="text-align:left;">
                    <div id="cf-status-title" style="color:#ffffff;font-size:14.5px;font-weight:800;letter-spacing:0.2px;">Verifying...</div>
                    <div id="cf-status-sub" style="color:#94a3b8;font-size:11.5px;font-weight:600;line-height:1.3;">Validating browser integrity & security shield...</div>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;opacity:0.9;padding-left:10px;">
                <svg width="24" height="16" viewBox="0 0 38 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M29.5 9.5C28.8 4.2 24.2 0 18.8 0C14.4 0 10.5 2.8 9.1 7C4 7.6 0 12 0 17.3C0 23.2 4.8 24 10.5 24H29.5C34.2 24 38 20.2 38 15.5C38 11.2 34.3 9.7 29.5 9.5Z" fill="#F38020"/>
                    <path d="M29.5 24H10.5C5.8 24 2 20.2 2 15.5C2 11.4 5 8 9.1 7.2C10.5 2.8 14.4 0 18.8 0C24.2 0 28.8 4.2 29.5 9.5C34.3 9.7 38 11.2 38 15.5C38 20.2 34.2 24 29.5 24Z" fill="#FAAE40"/>
                </svg>
                <span style="color:#ffffff;font-size:11.5px;font-weight:900;letter-spacing:0.5px;">CLOUDFLARE</span>
            </div>
        </div>
    </div>
</div>
<style>
@keyframes cfSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
<script>
(function() {
    setTimeout(function() {
        const icon = document.getElementById('cf-status-icon');
        const title = document.getElementById('cf-status-title');
        const sub = document.getElementById('cf-status-sub');
        const card = document.getElementById('cf-verification-card');

        if (icon && title && sub && card) {
            icon.style.animation = 'none';
            icon.style.border = 'none';
            icon.style.borderRadius = '0';
            icon.innerHTML = '<span style="color:#10b981;font-size:22px;font-weight:900;line-height:1;">✓</span>';
            title.textContent = 'Success!';
            title.style.color = '#10b981';
            sub.textContent = "Verified by Cloudflare Edge & Joyst Enclave";
            card.style.borderColor = 'rgba(16, 185, 129, 0.45)';
            card.style.boxShadow = '0 12px 35px rgba(0,0,0,0.8), 0 0 30px rgba(16, 185, 129, 0.25)';
        }

        setTimeout(function() {
            const gk = document.getElementById('cf-enclave-gatekeeper');
            if (gk) {
                gk.style.opacity = '0';
                setTimeout(function() { gk.style.display = 'none'; }, 450);
            }
        }, 900);
    }, 1300);
})();
</script>








    <div class="cyber-grid-overlay"></div>
    <div class="noise-overlay"></div>

    <div class="auth-card">
        <div class="auth-brand">
            <img src="/static/img/joyst_logo.png" alt="JOYST" style="width: 58px; height: 58px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 25px rgba(225, 29, 72, 0.6); border: 2px solid rgba(244, 63, 94, 0.6); margin-bottom: 8px;">
            <h2>RESELLER PORTAL</h2>
            <p>Access your authorized license generation console</p>
        </div>

        <form id="reseller-login-form">
            <div class="form-group" style="margin-bottom: 16px;">
                <label>Reseller Username</label>
                <input type="text" id="reseller-username" class="form-control" placeholder="Enter assigned username" required autofocus>
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label>Password</label>
                <input type="password" id="reseller-password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 14px; font-weight: 800;">
                Sign In to Reseller Portal
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 12px;">
            <a href="/" style="color: var(--text-muted); text-decoration: none;">&larr; Back to Main Platform</a>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        document.getElementById("reseller-login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const u = document.getElementById("reseller-username").value.trim();
            const p = document.getElementById("reseller-password").value;
            const btn = document.getElementById("btn-submit");

            btn.disabled = true;
            btn.textContent = "Authenticating...";

            try {
                const res = await fetch("/api/v1/reseller/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (data.success && data.token) {
                    localStorage.setItem("reseller_token", data.token);
                    window.location.href = "/reseller/dashboard";
                } else {
                    alert(data.detail || data.message || "Invalid credentials");
                    btn.disabled = false;
                    btn.textContent = "Sign In to Reseller Portal";
                }
            } catch (err) {
                alert("Network error: " + err.message);
                btn.disabled = false;
                btn.textContent = "Sign In to Reseller Portal";
            }
        });
    </script>
    <script src="/static/js/shield_defense.js?v=2.7.0"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOYST CORP AUTH | Reseller Portal Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #060204;
            padding: 20px;
            position: relative;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            backdrop-filter: blur(28px);
            border: 1px solid rgba(225, 29, 72, 0.35);
            border-radius: 18px;
            padding: 38px 32px;
            box-shadow: 0 15px 40px -10px rgba(225, 29, 72, 0.3);
            position: relative;
            z-index: 10;
        }
        .auth-brand {
            text-align: center;
            margin-bottom: 26px;
        }
        .auth-brand h2 {
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            margin-top: 10px;
        }
        .auth-brand p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
    </style>
</head>
<body>





<!-- Cloudflare Turnstile Verification Gatekeeper -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<div id="cf-enclave-gatekeeper" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#060205;z-index:99999999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui, -apple-system, sans-serif;transition:opacity 0.4s ease;">
    <div style="text-align:center;padding:40px 30px;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;">
        <img src="/static/img/joyst_logo.png" alt="JOYST AUTH" style="width:76px;height:76px;object-fit:contain;border-radius:18px;margin-bottom:22px;filter:drop-shadow(0 0 25px rgba(255,42,95,0.45));">
        <h1 style="color:#ffffff;font-size:26px;font-weight:900;letter-spacing:-0.4px;margin:0 0 10px 0;text-shadow:0 2px 10px rgba(0,0,0,0.5);">JOYST AUTH</h1>
        <p style="color:#94a3b8;font-size:15px;font-weight:500;margin:0 0 28px 0;">Please wait while we validate your connection.</p>
        
        <!-- High-Contrast Glass Card for Cloudflare Widget -->
        <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:14px;padding:8px 12px;box-shadow:0 12px 35px rgba(0,0,0,0.8),inset 0 1px 0 rgba(255,255,255,0.15);display:inline-flex;justify-content:center;align-items:center;min-width:320px;min-height:75px;margin-bottom:15px;">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAA8aqRqauHh_EMW2J" data-theme="dark" data-size="normal" data-callback="onCloudflareVerifySuccess"></div>
        </div>
    </div>
</div>
<script>
function onCloudflareVerifySuccess(token) {
    setTimeout(function() {
        const gk = document.getElementById('cf-enclave-gatekeeper');
        if (gk) {
            gk.style.opacity = '0';
            setTimeout(function() { gk.style.display = 'none'; }, 400);
        }
    }, 1000);
}
setTimeout(function() {
    const gk = document.getElementById('cf-enclave-gatekeeper');
    if (gk && gk.style.display !== 'none') {
        gk.style.opacity = '0';
        setTimeout(function() { gk.style.display = 'none'; }, 400);
    }
}, 3200);
</script>






    <div class="cyber-grid-overlay"></div>
    <div class="noise-overlay"></div>

    <div class="auth-card">
        <div class="auth-brand">
            <img src="/static/img/joyst_logo.png" alt="JOYST" style="width: 58px; height: 58px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 25px rgba(225, 29, 72, 0.6); border: 2px solid rgba(244, 63, 94, 0.6); margin-bottom: 8px;">
            <h2>RESELLER PORTAL</h2>
            <p>Access your authorized license generation console</p>
        </div>

        <form id="reseller-login-form">
            <div class="form-group" style="margin-bottom: 16px;">
                <label>Reseller Username</label>
                <input type="text" id="reseller-username" class="form-control" placeholder="Enter assigned username" required autofocus>
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label>Password</label>
                <input type="password" id="reseller-password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 14px; font-weight: 800;">
                Sign In to Reseller Portal
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 12px;">
            <a href="/" style="color: var(--text-muted); text-decoration: none;">&larr; Back to Main Platform</a>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        document.getElementById("reseller-login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const u = document.getElementById("reseller-username").value.trim();
            const p = document.getElementById("reseller-password").value;
            const btn = document.getElementById("btn-submit");

            btn.disabled = true;
            btn.textContent = "Authenticating...";

            try {
                const res = await fetch("/api/v1/reseller/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (data.success && data.token) {
                    localStorage.setItem("reseller_token", data.token);
                    window.location.href = "/reseller/dashboard";
                } else {
                    alert(data.detail || data.message || "Invalid credentials");
                    btn.disabled = false;
                    btn.textContent = "Sign In to Reseller Portal";
                }
            } catch (err) {
                alert("Network error: " + err.message);
                btn.disabled = false;
                btn.textContent = "Sign In to Reseller Portal";
            }
        });
    </script>
    <script src="/static/js/shield_defense.js?v=2.0"></script>
</body>
</html>

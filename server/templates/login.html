<head>

    <title>Joyst Corporation | Developer Authentication Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Official Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #07090e;
            padding: 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-highlight);
            border-radius: var(--radius-lg);
            padding: 38px;
            box-shadow: var(--shadow-md), 0 0 40px rgba(99, 102, 241, 0.1);
            position: relative;
            z-index: 10;
        }
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-accent);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }
        .auth-brand {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-brand h2 {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .auth-brand p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        #bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }
        #toast-container {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            width: auto;
            max-width: 90vw;
        }
        .toast {
            background: rgba(12, 3, 7, 0.88);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border-radius: 9999px;
            padding: 11px 26px;
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: 0.2px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.18);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            animation: dynamicIslandDrop 0.38s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
            white-space: nowrap;
        }
        .toast-success {
            border: 1px solid rgba(16, 185, 129, 0.6);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(16, 185, 129, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .toast-error {
            border: 1px solid rgba(239, 68, 68, 0.6);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(239, 68, 68, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .toast-info {
            border: 1px solid rgba(244, 63, 94, 0.6);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(244, 63, 94, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        @keyframes dynamicIslandDrop {
            0% { opacity: 0; transform: translateY(-35px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>

    <script>
        // 2-Hour KeyAuth-Style Auto-Login Session Check
        (function() {
            try {
                const token = localStorage.getItem("auth_admin_token");
                const loginTime = parseInt(localStorage.getItem("auth_login_time") || "0", 10);
                const TWO_HOURS_MS = 2 * 60 * 60 * 1000;
                const now = Date.now();

                // If token exists and was logged in within 2 hours, auto-redirect directly to dashboard!
                if (token && (now - loginTime) < TWO_HOURS_MS) {
                    window.location.replace("/dashboard");
                } else if (token && (now - loginTime) >= TWO_HOURS_MS) {
                    // Session expired after 2 hours
                    localStorage.removeItem("auth_admin_token");
                    localStorage.removeItem("auth_login_time");
                }
            } catch (e) {}
        })();
    </script>

</head>
<body>







<!-- Joyst Auth & Cloudflare Edge Verification Gatekeeper -->
<div id="cf-enclave-gatekeeper" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#060205;z-index:99999999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui, -apple-system, sans-serif;transition:opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);">

        <h1 style="color:#ffffff;font-size:26px;font-weight:900;letter-spacing:-0.4px;margin:0 0 10px 0;text-shadow:0 2px 10px rgba(0,0,0,0.5);">JOYST AUTH</h1>
        <p style="color:#94a3b8;font-size:15px;font-weight:500;margin:0 0 28px 0;">Please wait while we validate your connection.</p>
        
        <!-- High-Tech Cloudflare Security Verification Box -->
        <div id="cf-verification-card" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.13);border-radius:14px;padding:14px 22px;box-shadow:0 12px 35px rgba(0,0,0,0.8),inset 0 1px 0 rgba(255,255,255,0.15);display:inline-flex;justify-content:space-between;align-items:center;width:100%;max-width:350px;min-height:70px;margin-bottom:15px;transition:all 0.35s ease;">
            <div style="display:flex;align-items:center;gap:14px;">
                <div id="cf-status-icon" style="width:24px;height:24px;border:2.5px solid rgba(255,255,255,0.18);border-top:2.5px solid #10b981;border-radius:50%;animation:cfSpin 0.9s linear infinite;flex-shrink:0;"></div>
                <div style="text-align:left;">
                    <div id="cf-status-title" style="color:#ffffff;font-size:14.5px;font-weight:800;letter-spacing:0.2px;">Verifying...</div>
                    <div id="cf-status-sub" style="color:#94a3b8;font-size:11.5px;font-weight:600;line-height:1.3;">Validating browser integrity & security shield...</div>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;opacity:0.9;padding-left:10px;">
                <svg width="24" height="16" viewBox="0 0 38 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M29.5 9.5C28.8 4.2 24.2 0 18.8 0C14.4 0 10.5 2.8 9.1 7C4 7.6 0 12 0 17.3C0 23.2 4.8 24 10.5 24H29.5C34.2 24 38 20.2 38 15.5C38 11.2 34.3 9.7 29.5 9.5Z" fill="#F38020"/>
                    <path d="M29.5 24H10.5C5.8 24 2 20.2 2 15.5C2 11.4 5 8 9.1 7.2C10.5 2.8 14.4 0 18.8 0C24.2 0 28.8 4.2 29.5 9.5C34.3 9.7 38 11.2 38 15.5C38 20.2 34.2 24 29.5 24Z" fill="#FAAE40"/>
                </svg>
                <span style="color:#ffffff;font-size:11.5px;font-weight:900;letter-spacing:0.5px;">CLOUDFLARE</span>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    setTimeout(function() {
        const icon = document.getElementById('cf-status-icon');
        const title = document.getElementById('cf-status-title');
        const sub = document.getElementById('cf-status-sub');
        const card = document.getElementById('cf-verification-card');

        if (icon && title && sub && card) {
            icon.style.animation = 'none';
            icon.style.border = 'none';
            icon.style.borderRadius = '0';
            icon.innerHTML = '<span style="color:#10b981;font-size:22px;font-weight:900;line-height:1;">✓</span>';
            title.textContent = 'Success!';
            title.style.color = '#10b981';
            sub.textContent = "Verified by Cloudflare Edge & Joyst Enclave";
            card.style.borderColor = 'rgba(16, 185, 129, 0.45)';
            card.style.boxShadow = '0 12px 35px rgba(0,0,0,0.8), 0 0 30px rgba(16, 185, 129, 0.25)';
        }

        setTimeout(function() {
            const gk = document.getElementById('cf-enclave-gatekeeper');
            if (gk) {
                gk.style.opacity = '0';
                setTimeout(function() { gk.style.display = 'none'; }, 450);
            }
        }, 900);
    }, 1300);
})();
</script>

    <script src="/static/js/particles.js?v=3.0.0"></script>
    <script>
        const GOOGLE_CLIENT_ID = "1029635040070-o00five90cn8ur7fhu4u5jnp8cbcdrla.apps.googleusercontent.com";

        function showToast(message, type = "success") {
            const container = document.getElementById("toast-container");
            container.innerHTML = "";
            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;
            const icon = type === 'success' ? '✅' : (type === 'error' ? '🚫' : '⚡');
            toast.innerHTML = `<span style="font-size: 16px;">${icon}</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = "0";
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        
        function handleGoogleCredentialResponse(response) {
            if (response && response.credential) {
                try {
                    const payload = JSON.parse(atob(response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
                    fetch("/api/v1/auth/google", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email: payload.email, name: payload.name, google_id: payload.sub, picture: payload.picture })
                    }).then(r => r.json()).then(data => {
                        if (data.access_token) {
                            localStorage.setItem("auth_admin_token", data.access_token);
                    localStorage.setItem("auth_login_time", Date.now().toString());
                            localStorage.setItem("dev_owner_id", data.owner_id);
                            localStorage.setItem("dev_username", data.username);
                            showToast("Login Successful! Welcome to Joyst Auth", "success");
                            setTimeout(() => {
                                window.location.href = data.redirect_url || "/dashboard";
                            }, 400);
                        } else {
                            showToast(data.detail || "Google authentication failed", "error");
                        }
                    }).catch(err => {
                        showToast("Connection failed: " + err.message, "error");
                    });
                } catch (e) {
                    console.error("JWT Decode error:", e);
                }
            }
        }

        let tokenClient;

        function initGoogleServices() {
            if (window.google && window.google.accounts) {
                try {
                    // 1. One-Tap Popup Initializer (Pops up automatically on top-right of page)
                    if (window.google.accounts.id) {
                        google.accounts.id.initialize({
                            client_id: GOOGLE_CLIENT_ID,
                            callback: handleGoogleCredentialResponse,
                            auto_select: false,
                            cancel_on_tap_outside: true
                        });
                        google.accounts.id.prompt((notification) => {
                            if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                                console.log("Google One Tap status:", notification.getNotDisplayedReason());
                            }
                        });
                    }

                    // 2. Token Client for Button Click
                    if (window.google.accounts.oauth2) {
                        tokenClient = google.accounts.oauth2.initTokenClient({
                            client_id: GOOGLE_CLIENT_ID,
                            scope: "openid email profile",
                            prompt: "select_account",
                            callback: async (tokenResponse) => {
                                if (tokenResponse && tokenResponse.access_token) {
                                    try {
                                        const userInfoRes = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
                                            headers: { Authorization: `Bearer ${tokenResponse.access_token}` }
                                        });
                                        const userInfo = await userInfoRes.json();
                                        const res = await fetch("/api/v1/auth/google", {
                                            method: "POST",
                                            headers: { "Content-Type": "application/json" },
                                            body: JSON.stringify({ email: userInfo.email, name: userInfo.name, google_id: userInfo.sub, picture: userInfo.picture })
                                        });
                                        const data = await res.json();
                                        if (res.ok && data.access_token) {
                                            localStorage.setItem("auth_admin_token", data.access_token);
                    localStorage.setItem("auth_login_time", Date.now().toString());
                                            localStorage.setItem("dev_owner_id", data.owner_id);
                                            localStorage.setItem("dev_username", data.username);
                                            showToast("Login Successful! Welcome to Joyst Auth", "success");
                                            setTimeout(() => {
                                                window.location.href = data.redirect_url || "/dashboard";
                                            }, 400);
                                        } else {
                                            showToast(data.detail || "Google authentication failed", "error");
                                        }
                                    } catch (err) {
                                        showToast("Connection failed: " + err.message, "error");
                                    }
                                }
                            }
                        });
                    }
                } catch (e) {
                    console.warn("Google Services Init:", e);
                }
            }
        }

        window.addEventListener("load", () => {
            setTimeout(initGoogleServices, 200);
        });

        function handleGoogleSignInClick() {
            if (tokenClient) {
                tokenClient.requestAccessToken({ prompt: "select_account" });
            } else if (window.google && window.google.accounts && window.google.accounts.id) {
                google.accounts.id.prompt();
            }
        }

        
        // Check URL for OAuth errors on page load
        window.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const err = params.get("error");
            if (err) {
                let msg = "Authentication failed. Please try again.";
                if (err === "discord_failed") msg = "Discord authentication was rejected. Please try again.";
                else if (err === "discord_user_failed") msg = "Could not retrieve Discord user profile.";
                else if (err === "google_failed") msg = "Google sign-in failed. Please try again.";
                else msg = err.replace(/_/g, " ");
                showToast(msg, "error");
            }
        });

        function handleDiscordSignInClick() {
            localStorage.clear();
            window.location.href = "/api/v1/auth/discord/login";
        }

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("login-username").value.trim();
            const password = document.getElementById("login-password").value;
            const btn = document.getElementById("btn-submit");

            btn.disabled = true;
            btn.textContent = "Signing In...";

            try {
                const res = await fetch("/api/v1/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok && data.access_token) {
                    if (data.role === "reseller") {
                        localStorage.setItem("reseller_token", data.access_token);
                        showToast("Reseller Account Authenticated! Opening Reseller Console...", "success");
                        setTimeout(() => {
                            window.location.href = data.redirect_url || "/reseller/dashboard";
                        }, 500);
                    } else {
                        localStorage.setItem("auth_admin_token", data.access_token);
                    localStorage.setItem("auth_login_time", Date.now().toString());
                        localStorage.setItem("dev_owner_id", data.owner_id);
                        localStorage.setItem("dev_username", data.username);
                        showToast("Developer Workspace Authenticated! Opening Dashboard...", "success");
                        setTimeout(() => {
                            window.location.href = data.redirect_url || "/dashboard";
                        }, 500);
                    }
                } else {
                    showToast(data.detail || "Invalid username or password", "error");
                    btn.disabled = false;
                    btn.textContent = "Sign In to Portal";
                }
            } catch (err) {
                showToast("Connection failed: " + err.message, "error");
                btn.disabled = false;
                btn.textContent = "Sign In to Portal";
            }
        });
    </script>
    <script src="/static/js/shield_defense.js?v=3.0.0"></script>
